[project]
name = "minifilebot"
version = "0.1.0"
description = "A FileBot-style CLI that renames anime/TV episode files using TMDB metadata."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "OpenFileBot" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "anitopy>=2.1",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "respx>=0.21",
    "ruff>=0.5",
]
gui = [
    "pyside6>=6.7",
]

[project.scripts]
minifilebot = "minifilebot.cli:app"
minifilebot-gui = "minifilebot.gui.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minifilebot"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic default-arg pattern trips B008 by design.
"src/minifilebot/cli.py" = ["B008"]
# PySide6 requires camelCase override signatures with Qt singleton defaults.
"src/minifilebot/gui/*.py" = ["N802", "N803", "N806", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
