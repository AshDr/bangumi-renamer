[package]
name = "bangumi-renamer-desktop"
version = "0.1.0"
description = "Safe anime and TV episode renamer"
authors = ["OpenFileBot"]
edition = "2021"

[lib]
name = "bangumi_renamer_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
